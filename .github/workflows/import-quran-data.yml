name: Import official KFGQPC Hafs dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Download official archive with curl retries
        run: |
          mkdir -p data/_raw
          curl --fail --location --show-error --retry 3 --retry-all-errors --connect-timeout 30 --max-time 180 \
            https://download.qurancomplex.gov.sa/resources_dev/UthmanicHafs_v2-0.zip \
            --output data/_raw/UthmanicHafs_v2-0.zip

      - name: Verify and import official dataset
        run: npm run import:kfgqpc

      - name: Upload validated dataset as a private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-hafs-validated
          path: data/quran-hafs.json
          if-no-files-found: error
          retention-days: 7
