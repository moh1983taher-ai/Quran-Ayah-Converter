name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Import the pinned Hafs dataset for full-dataset regression tests
        run: npm run import:kfgqpc
      - run: npm run typecheck
      - run: npm test
      - name: Build Word task pane bundle
        run: npm run build:taskpane
