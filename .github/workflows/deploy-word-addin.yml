name: Build and deploy Word task pane

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Import and validate the approved Hafs dataset
        run: |
          npm run import:kfgqpc
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const data = JSON.parse(readFileSync("data/quran-hafs.json", "utf8")); if (data.recordCount !== 6236 || data.records?.length !== 6236) throw new Error("Hafs dataset must contain exactly 6,236 ayahs"); console.log("Verified", data.recordCount, "Hafs ayahs");'

      - name: Verify source and tests
        run: |
          npm run typecheck
          npm test

      - name: Build task pane bundle
        run: npm run build:taskpane

      - name: Assemble static Word add-in site
        run: |
          mkdir -p site/assets site/data
          cp src/word/taskpane.html site/taskpane.html
          cp src/word/taskpane.css site/taskpane.css
          cp src/word/taskpane.js site/taskpane.js
          echo "Repository root: $(git rev-parse --show-toplevel)"
          echo "Checked-out commit: $(git rev-parse HEAD)"
          git ls-tree HEAD assets/icon-32.png assets/icon-80.png
          git show HEAD:assets/icon-32.png > site/assets/icon-32.png
          git show HEAD:assets/icon-80.png > site/assets/icon-80.png
          test -s data/quran-hafs.json
          cp data/quran-hafs.json site/data/quran-hafs.json
          cat > site/data/NOTICE.txt <<'EOF'
          Quran text dataset: Hafs narration, 6,236 ayahs.
          Source dataset: KFGQPC Hafs data (v18 / update 10.0), retrieved from the pinned mirror:
          https://github.com/thetruetruth/quran-data-kfgqpc
          Source commit: 281dbbe8eed1370daa5a023b6cd81655cbfd6473
          The dataset is included for the Quran Ayah Converter under the permission obtained for this project.
          EOF
          touch site/.nojekyll
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محوّل الآيات القرآنية</title><meta http-equiv="refresh" content="0;url=taskpane.html"></head><body><a href="taskpane.html">فتح محوّل الآيات</a></body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
